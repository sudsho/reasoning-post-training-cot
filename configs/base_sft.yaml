# base SFT-on-CoT config for Qwen2.5-1.5B student

model:
  name_or_path: Qwen/Qwen2.5-1.5B
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: true

data:
  train_file: data/distilled/train.jsonl
  eval_file: data/distilled/eval.jsonl
  max_seq_len: 2048
  # loss is computed only on the assistant response span (trace + answer)
  response_only_loss: true
  # padding side matters for causal-lm response-only masking
  padding_side: right

train:
  output_dir: outputs/sft_cot_qwen2_5_1_5b
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  optim: adamw_torch_fused
  seed: 17
  report_to: wandb
  run_name: sft_cot_qwen2_5_1_5b_v1
