[project]
name = "reasoning-post-training-cot"
version = "0.1.0"
description = "CoT SFT + GRPO refinement + self-consistency for Qwen2.5-1.5B"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Sudhanshu Srivastava"}]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
